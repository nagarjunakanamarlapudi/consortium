schema_version: '1.0'
name: swallowed-error
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Dispatch the consortium:code-reviewer agent with the whole text of brief.md as its prompt. Then print
    its final report verbatim and nothing else.
  model: haiku
  max_turns: 12
  timeout_seconds: 900
  allowed_tools:
  - Read
  - Grep
  - Glob
  - Bash
  - Agent
  - Edit
  - Write
  append_system_prompt: The brief.md in the user request is briefs/code-reviewer/swallowed-error/brief.md. The assigned
    repository is repos/code-reviewer/swallowed-error/. Read that brief and dispatch the named plugin agent with
    its whole text. Let the agent use its configured front matter model; do not override its model. The agent must
    work in the assigned repository, not search the eval session root.
graders:
- type: llm
  name: silent-failure
  criteria: 'The findings payload contains a high finding on shop/pricing.py explaining that except Exception: pass
    silently hides a failed write and proposing a concrete fix.'
- type: tool_used
  name: dispatch
  tool: Agent
  input_match: consortium:code-reviewer
  min: 1
