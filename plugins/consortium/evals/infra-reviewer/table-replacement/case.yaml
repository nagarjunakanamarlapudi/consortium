schema_version: '1.0'
name: table-replacement
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Dispatch the consortium:infra-reviewer agent with the whole text of brief.md as its prompt. Then print
    its final report verbatim and nothing else.
  model: haiku
  max_turns: 12
  timeout_seconds: 900
  allowed_tools:
  - Read
  - Grep
  - Glob
  - Bash
  - Agent
  - Edit
  - Write
  append_system_prompt: The brief.md in the user request is briefs/infra-reviewer/table-replacement/brief.md. The
    assigned repository is repos/infra-reviewer/table-replacement/. Read that brief and dispatch the named plugin
    agent with its whole text. Let the agent use its configured front matter model; do not override its model. The
    agent must work in the assigned repository, not search the eval session root.
graders:
- type: llm
  name: replacement
  criteria: A finding identifies the logical id rename in infra/table.py as resource replacement with data loss
    risk, and gives a concrete correction or migration strategy.
- type: tool_used
  name: dispatch
  tool: Agent
  input_match: consortium:infra-reviewer
  min: 1
