schema_version: '1.0'
name: hardcoded-default
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Dispatch the consortium:investigator agent with the whole text of brief.md as its prompt. Then print its
    final report verbatim and nothing else.
  model: haiku
  max_turns: 12
  timeout_seconds: 900
  allowed_tools:
  - Read
  - Grep
  - Glob
  - Bash
  - Agent
  - Edit
  - Write
  append_system_prompt: The brief.md in the user request is briefs/investigator/hardcoded-default/brief.md. The
    assigned repository is repos/investigator/hardcoded-default/. Read that brief and dispatch the named plugin
    agent with its whole text. Let the agent use its configured front matter model; do not override its model. The
    agent must work in the assigned repository, not search the eval session root.
graders:
- type: regex
  name: root-cause
  pattern: '"root_cause"\s*:\s*\{\s*"file"\s*:\s*"(?:[^"\n]*/)?shop/distance\.py"'
- type: regex
  name: failing-test
  pattern: '"failing_test"\s*:\s*\{'
- type: llm
  name: reproduction
  criteria: The report identifies shop/distance.py as the hardcoded origin root cause and records a failing regression
    test with a nonzero exit code. It reproduces missing-origin behavior before proposing a fix; production code
    remains unchanged.
- type: tool_used
  name: dispatch
  tool: Agent
  input_match: consortium:investigator
  min: 1
