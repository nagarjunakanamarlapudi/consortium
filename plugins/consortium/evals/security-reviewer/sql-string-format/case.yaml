schema_version: '1.0'
name: sql-string-format
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Dispatch the consortium:security-reviewer agent with the whole text of brief.md as its prompt. Then print
    its final report verbatim and nothing else.
  model: haiku
  max_turns: 12
  timeout_seconds: 900
  allowed_tools:
  - Read
  - Grep
  - Glob
  - Bash
  - Agent
  - Edit
  - Write
  append_system_prompt: The brief.md in the user request is briefs/security-reviewer/sql-string-format/brief.md.
    The assigned repository is repos/security-reviewer/sql-string-format/. Read that brief and dispatch the named
    plugin agent with its whole text. Let the agent use its configured front matter model; do not override its model.
    The agent must work in the assigned repository, not search the eval session root.
graders:
- type: llm
  name: injection
  criteria: The findings payload contains a critical or high SQL injection finding on shop/auth.py caused by interpolating
    untrusted input into an f-string query. It proposes parameterized queries.
- type: tool_used
  name: dispatch
  tool: Agent
  input_match: consortium:security-reviewer
  min: 1
